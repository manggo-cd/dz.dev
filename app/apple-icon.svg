<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="moon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="180" height="180" fill="#0a0a0a"/>
  
  <!-- Crescent moon using circle subtraction -->
  <mask id="crescentMask">
    <circle cx="90" cy="90" r="60" fill="white"/>
    <circle cx="120" cy="70" r="50" fill="black"/>
  </mask>
  
  <circle cx="90" cy="90" r="60" fill="url(#moon)" mask="url(#crescentMask)"/>
</svg>
